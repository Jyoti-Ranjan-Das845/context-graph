[project]
name = "context-graph"
version = "0.1.0"
description = "A personal context graph built from your work tools, local and open source."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "airbyte>=0.71",
    "duckdb>=1.4",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
    "typer>=0.27",
    "mcp>=1.30",
    "google-auth-oauthlib>=1.5",
    "graphifyy>=0.9.81",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx>=0.28", "pyyaml>=6"]

[project.scripts]
context-graph = "context_graph.interfaces.cli:app"
cg = "context_graph.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_graph"]
# The built web app is generated (not in git), so it is listed explicitly to be shipped.
artifacts = ["src/context_graph/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["contract: validates generated connector configs against the connectors' published specs"]
